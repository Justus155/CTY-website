<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — CTY Ministries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/style.css" />
</head>
<body class="auth-screen auth-screen--signin">

  <div class="screen">

    <!-- LEFT: brand panel -->
    <aside class="brand-panel">
      <div class="brand-inner">
        <svg class="mark" viewBox="0 0 200 200" width="120" height="120" aria-hidden="true">
          <g class="rays" stroke="#F7F1E4" stroke-width="2.4" stroke-linecap="round">
            <line x1="100" y1="34" x2="100" y2="4"/>
            <line x1="129" y1="42" x2="146" y2="17"/>
            <line x1="151" y1="64" x2="176" y2="47"/>
            <line x1="159" y1="93" x2="188" y2="93"/>
            <line x1="151" y1="122" x2="176" y2="139"/>
            <line x1="129" y1="144" x2="146" y2="169"/>
            <line x1="71" y1="144" x2="54" y2="169"/>
            <line x1="49" y1="122" x2="24" y2="139"/>
            <line x1="41" y1="93" x2="12" y2="93"/>
            <line x1="49" y1="64" x2="24" y2="47"/>
            <line x1="71" y1="42" x2="54" y2="17"/>
          </g>
          <rect class="cross-v" x="91" y="55" width="18" height="84" fill="#F7F1E4"/>
          <rect class="cross-h" x="69" y="83" width="62" height="18" fill="#F7F1E4"/>
          <g class="stars" fill="#C9971E">
            <path d="M139 44l3.4 8.6 9.2.6-7 6 2.2 9-7.8-5-7.8 5 2.2-9-7-6 9.2-.6z" transform="scale(0.55) translate(115,10)"/>
            <path d="M139 44l3.4 8.6 9.2.6-7 6 2.2 9-7.8-5-7.8 5 2.2-9-7-6 9.2-.6z" transform="scale(0.42) translate(190,60)"/>
            <path d="M139 44l3.4 8.6 9.2.6-7 6 2.2 9-7.8-5-7.8 5 2.2-9-7-6 9.2-.6z" transform="scale(0.65) translate(90,-6)"/>
          </g>
        </svg>

        <h1 class="wordmark">CTY<span>MINISTRIES</span></h1>
        <p class="tagline">Children · Teens · Youth</p>

        <div class="brand-quote">
          <p>“The Bridge Between Generations”</p>
        </div>
      </div>

      <p class="brand-foot">Shine for Jesus</p>
    </aside>

    <!-- RIGHT: auth panel -->
    <main class="auth-panel">
      <div class="auth-box">

        <nav class="page-tabs">
          <a href="signin.html" class="tab is-active">Sign in</a>
          <a href="signup.html" class="tab">Join CTY</a>
        </nav>

        <form id="form-signin" class="auth-form is-active" novalidate>
          <h2>Welcome back</h2>
          <p class="sub">Good to see you again — let's get you signed in.</p>

          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
          </label>

          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
          </label>

          <a href="forgotpassword.html" class="link-btn">Forgot password?</a>

          <p class="error" id="signin-error" role="alert"></p>

          <button type="submit" class="btn-primary">
            <span class="btn-label">Sign in</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="switch-line">
          New here? <a href="signup.html">Create an account</a>
        </p>

      </div>
    </main>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../Javascript files/signin.js"></script>
</body>
</html>
