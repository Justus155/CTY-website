<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — CTY Ministries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../home/home.css" />
<link rel="stylesheet" href="../styles/admin.css" />
</head>
<body>

  <div id="gate" class="gate">
    <p>Checking access…</p>
  </div>

  <div id="admin-app" hidden>

    <header class="admin-header">
      <a href="../home/home.html" class="brand-lockup">
        <svg viewBox="0 0 200 200" width="30" height="30" aria-hidden="true">
          <g stroke="#F7F1E4" stroke-width="4" stroke-linecap="round">
            <line x1="100" y1="34" x2="100" y2="4"/>
            <line x1="151" y1="64" x2="176" y2="47"/>
            <line x1="159" y1="93" x2="188" y2="93"/>
            <line x1="151" y1="122" x2="176" y2="139"/>
            <line x1="49" y1="122" x2="24" y2="139"/>
            <line x1="41" y1="93" x2="12" y2="93"/>
            <line x1="49" y1="64" x2="24" y2="47"/>
          </g>
          <rect x="91" y="55" width="18" height="84" fill="#F7F1E4"/>
          <rect x="69" y="83" width="62" height="18" fill="#F7F1E4"/>
        </svg>
        <span>CTY <em>Admin</em></span>
      </a>
      <a href="../home/home.html" class="btn-ghost">← Back to site</a>
    </header>

    <main class="admin-main">

      <section class="upload-panel">
        <h1>Upload new content</h1>
        <p class="sub">Add a photo, video, or testimony. It'll appear on the homepage and Posts page right away.</p>

        <form id="upload-form" novalidate>
          <div class="type-toggle" id="type-toggle">
            <button type="button" class="type-btn is-active" data-type="photo">Photo</button>
            <button type="button" class="type-btn" data-type="video">Video</button>
            <button type="button" class="type-btn" data-type="testimony">Testimony (text only)</button>
          </div>

          <label class="field" id="file-field">
            <span>File</span>
            <input type="file" id="file-input" accept="image/*" />
            <span class="field-hint" id="file-hint">JPG or PNG, up to 10MB.</span>
          </label>

          <div class="preview" id="preview" hidden></div>

          <label class="field">
            <span>Caption</span>
            <textarea id="caption-input" rows="3" placeholder="What happened? Who was it for? Why does it matter?" required></textarea>
          </label>

          <label class="checkbox-field">
            <input type="checkbox" id="featured-input" />
            <span>Feature this on the homepage hero</span>
          </label>

          <p class="error" id="upload-error" role="alert"></p>
          <p class="upload-progress" id="upload-progress" hidden></p>

          <button type="submit" class="btn-primary" id="upload-btn">
            <span class="btn-label">Publish</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <section class="recent-panel">
        <h2>Recently uploaded</h2>
        <div class="recent-list" id="recent-list">
          <p class="empty-hint">Nothing uploaded yet.</p>
        </div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../Javascript files/admin.js"></script>
</body>
</html>
