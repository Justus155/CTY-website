<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="CTY Ministries — Children, Teens and Youth growing together in Christ. Belong. Grow. Serve. Shine." />
<title>CTY Ministries | Belong. Grow. Serve. Shine.</title>
<link rel="icon" type="image/png" href="Logo%20Design%20in%20Canva.png" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #11100e;
    color: #fbf8f0;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #d2a238, #8c6618);
    font-size: 34px;
    animation: rise .7s cubic-bezier(.22, 1, .36, 1) both;
  }
  p { margin: 0 0 22px; color: rgba(251, 248, 240, .7); font-size: .95rem; }
  a {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 999px;
    background: #d2a238;
    color: #11100e;
    font-weight: 700;
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(210, 162, 56, .3); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
</style>
<script>
  // Seamless hand-off to the homepage (replaces the old jarring meta-refresh)
  window.location.replace("home/homepage.html");
</script>
</head>
<body>
  <div class="mark" aria-hidden="true">✝</div>
  <p>Taking you to CTY Ministries…</p>
  <a href="home/homepage.html">Continue</a>
</body>
</html>
