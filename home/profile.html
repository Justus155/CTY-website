<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — CTY Ministries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../Logo%20Design%20in%20Canva.png" />
<link rel="stylesheet" href="profile.css" />
</head>
<body>

  <main class="profile-shell">
    <div class="profile-header">
      <h2>My Profile</h2>
      <!-- Close button for the modal -->
      <button type="button" class="close-modal-btn" id="panel-close-btn" aria-label="Close profile">×</button>
    </div>

    <div class="profile-content">
      <div class="avatar-block">
        <div class="avatar-preview" id="avatar-preview" aria-hidden="true">U</div>
        <div class="avatar-actions">
          <label for="avatar-file" class="upload-label">Choose new photo</label>
          <input id="avatar-file" type="file" accept="image/*" />
          <p class="hint">JPG, PNG, WEBP up to 5MB.</p>
        </div>
      </div>

      <form id="profile-form" novalidate>
        <label class="field">
          <span>Full name</span>
          <input type="text" id="profile-name" readonly />
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" id="profile-email" readonly />
        </label>

        <label class="field">
          <span>Ministry group</span>
          <input type="text" id="profile-group" readonly />
        </label>

        <p class="error" id="profile-error" role="alert"></p>

        <div class="profile-actions">
          <button type="submit" class="btn-primary" id="save-avatar-btn">Save Profile Picture</button>
          <button type="button" class="btn-secondary" id="remove-avatar-btn">Remove Picture</button>
        </div>
      </form>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="profile.js"></script>
</body>
</html>
